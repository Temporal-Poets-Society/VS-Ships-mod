<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hansa ship preview</title>
<style>
  :root { --bg: #e9eef1; --panel: #f8fafb; --text: #1f2a30; --muted: #5b6b73; --line: #c9d3d8; --accent: #2f6f8f; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1b2125; --panel: #232b30; --text: #e3e9ec; --muted: #9aabb3; --line: #3a464d; --accent: #7fb6d1; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, sans-serif; }
  body { display: grid; grid-template-columns: 1fr 260px; height: 100vh; }
  canvas { width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
  canvas:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }
  aside { background: var(--panel); border-left: 1px solid var(--line); padding: 14px 16px; overflow-y: auto; }
  h1 { font-size: 16px; margin: 0 0 2px; font-weight: 600; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 6px; font-weight: 600; }
  p { margin: 0; color: var(--muted); font-size: 12px; }
  .views { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  button { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  label { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .slider { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin: 6px 0 10px; }
  .slider input { grid-column: 1 / -1; width: 100%; }
  .slider output { color: var(--muted); font-variant-numeric: tabular-nums; }
  @media (max-width: 700px) { body { grid-template-columns: 1fr; grid-template-rows: 60vh auto; } aside { border-left: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<canvas id="view" tabindex="0" aria-label="Ship preview. Drag to orbit, shift-drag or right-drag to pan, scroll to zoom. Arrow keys orbit, plus and minus zoom."></canvas>
<aside>
  <h1 id="title">Hansa ship preview</h1>
  <p id="stats"></p>
  <h2>Views</h2>
  <div class="views">
    <button data-view="exterior">Exterior</button>
    <button data-view="cutaway">Cutaway</button>
    <button data-view="section">Section</button>
    <button data-view="lower">Lower deck</button>
  </div>
  <h2>Show</h2>
  <div id="groups"></div>
  <label><input type="checkbox" id="edges"> Cell edges</label>
  <label><input type="checkbox" id="marks"> Fittings marked</label>
  <label><input type="checkbox" id="water"> Waterline</label>
  <h2>Cuts</h2>
  <div class="slider"><label for="cutZ">Across: keep z up to</label><output id="cutZv"></output><input type="range" id="cutZ" step="0.25"></div>
  <div class="slider"><label for="cutY">Height: keep y up to</label><output id="cutYv"></output><input type="range" id="cutY" step="0.25"></div>
  <div class="slider"><label for="cutX">Length: keep x from</label><output id="cutXv"></output><input type="range" id="cutX" step="0.25"></div>
  <p>Built by the construction core from the design data. Textures are the game's own, one repeat per block of surface.</p>
</aside>
<script id="ship" type="application/json">__SHIP_DATA__</script>
<script>
"use strict";
const ship = JSON.parse(document.getElementById("ship").textContent);
document.getElementById("title").textContent = ship.name;
document.getElementById("stats").textContent = ship.stats;
const canvas = document.getElementById("view");
const gl = canvas.getContext("webgl2", { antialias: true });
if (!gl) { document.getElementById("stats").textContent = "This preview needs WebGL2."; throw new Error("no webgl2"); }

const f32 = b => { const s = atob(b), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return new Float32Array(u.buffer); };
const u32 = b => { const s = atob(b), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return new Uint32Array(u.buffer); };

function program(vs, fs) {
  const p = gl.createProgram();
  for (const [type, src] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    gl.attachShader(p, s);
  }
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}
const CLIP = `uniform vec3 cutLo, cutHi; in vec3 vPos;
  void clip() { if (any(lessThan(vPos, cutLo)) || any(greaterThan(vPos, cutHi))) discard; }`;
const faces = program(`#version 300 es
  layout(location=0) in vec3 pos; layout(location=1) in vec3 nrm; layout(location=2) in vec2 uv;
  uniform mat4 mvp; out vec3 vPos; out vec3 vNrm; out vec2 vUv;
  void main() { vPos = pos; vNrm = nrm; vUv = uv; gl_Position = mvp * vec4(pos, 1.0); }`,
  `#version 300 es
  precision highp float; ${CLIP}
  in vec3 vNrm; in vec2 vUv; uniform sampler2D tex; uniform float glass; out vec4 color;
  void main() {
    clip();
    vec4 c = texture(tex, vUv);
    if (glass < 0.5 && c.a < 0.5) discard;
    vec3 n = normalize(vNrm), l = normalize(vec3(0.35, 0.85, 0.4));
    float light = 0.5 + 0.5 * max(dot(n, l), 0.0) + 0.12 * max(dot(n, -l), 0.0);
    color = vec4(c.rgb * light, glass > 0.5 ? max(c.a, 0.35) : 1.0);
  }`);
const lines = program(`#version 300 es
  layout(location=0) in vec3 pos; uniform mat4 mvp; out vec3 vPos;
  void main() { vPos = pos; gl_Position = mvp * vec4(pos, 1.0); }`,
  `#version 300 es
  precision highp float; ${CLIP} uniform vec4 tint; out vec4 color;
  void main() { clip(); color = tint; }`);

function buffer(target, data) { const b = gl.createBuffer(); gl.bindBuffer(target, b); gl.bufferData(target, data, gl.STATIC_DRAW); return b; }
const textures = ship.textures.map(t => {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([160, 120, 80, 255]));
  const img = new Image();
  img.onload = () => {
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
    draw();
  };
  img.src = "data:image/png;base64," + t.png;
  return { tex, glass: t.glass };
});

const lo = [Infinity, Infinity, Infinity], hi = [-Infinity, -Infinity, -Infinity];
const batches = ship.batches.map(b => {
  const pos = f32(b.pos), vao = gl.createVertexArray();
  for (let i = 0; i < pos.length; i++) { const a = i % 3; lo[a] = Math.min(lo[a], pos[i]); hi[a] = Math.max(hi[a], pos[i]); }
  gl.bindVertexArray(vao);
  [[pos, 3], [f32(b.nrm), 3], [f32(b.uv), 2]].forEach(([data, n], loc) => {
    buffer(gl.ARRAY_BUFFER, data); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, n, gl.FLOAT, false, 0, 0);
  });
  const index = u32(b.index); buffer(gl.ELEMENT_ARRAY_BUFFER, index);
  gl.bindVertexArray(null);
  return { vao, count: index.length, texture: textures[b.texture], category: b.category };
});
function lineSet(data) {
  const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
  buffer(gl.ARRAY_BUFFER, data); gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
  gl.bindVertexArray(null); return { vao, count: data.length / 3 };
}
const edges = lineSet(f32(ship.edges));
const marks = lineSet(f32(ship.marks || ""));
const wl = ship.waterline, pad = 3;
const water = (() => {
  const x0 = lo[0] - pad, x1 = hi[0] + pad, z0 = lo[2] - pad, z1 = hi[2] + pad, p = [x0, wl, z0, x1, wl, z0, x1, wl, z1, x0, wl, z0, x1, wl, z1, x0, wl, z1];
  const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
  buffer(gl.ARRAY_BUFFER, new Float32Array(p)); gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
  gl.bindVertexArray(null); return { vao, count: 6 };
})();

// ---- controls -----------------------------------------------------------------------------
const labels = { hull: "Hull planking", frame: "Keel, ribs, beams", deck: "Decks", walls: "Walls and doors", stair: "Stairs", glass: "Glass" };
const shown = {};
const groups = document.getElementById("groups");
for (const c of [...new Set(batches.map(b => b.category))]) {
  shown[c] = true;
  const l = document.createElement("label"), i = document.createElement("input");
  i.type = "checkbox"; i.checked = true; i.addEventListener("change", () => { shown[c] = i.checked; draw(); });
  l.append(i, " " + (labels[c] || c)); groups.append(l);
}
const sliders = {};
for (const [id, axis, min, max, start] of [["cutZ", 2, lo[2], hi[2], hi[2]], ["cutY", 1, lo[1], hi[1], hi[1]], ["cutX", 0, lo[0], hi[0], lo[0]]]) {
  const el = document.getElementById(id), out = document.getElementById(id + "v");
  el.min = Math.floor(min); el.max = Math.ceil(max); el.value = start;
  const update = () => { out.textContent = (+el.value).toFixed(2); draw(); };
  el.addEventListener("input", update); sliders[id] = { el, out, set: v => { el.value = v; out.textContent = (+el.value).toFixed(2); } };
  sliders[id].set(start);
}
for (const id of ["edges", "water", "marks"]) document.getElementById(id).addEventListener("change", () => draw());

const centre = [(lo[0] + hi[0]) / 2, (lo[1] + hi[1]) / 2, (lo[2] + hi[2]) / 2];
const size = Math.hypot(hi[0] - lo[0], hi[1] - lo[1], hi[2] - lo[2]);
const cam = { yaw: -0.75, pitch: 0.42, dist: size * 1.15, target: centre.slice() };
const views = {
  exterior: () => ({ yaw: -0.75, pitch: 0.42, dist: size * 1.15, target: centre.slice(), cuts: [hi[2], hi[1], lo[0]] }),
  cutaway: () => ({ yaw: -0.5, pitch: 0.55, dist: size * 1.05, target: centre.slice(), cuts: [0.5, hi[1], lo[0]] }),
  section: () => ({ yaw: Math.PI, pitch: 0.08, dist: size * 0.9, target: centre.slice(), cuts: [hi[2], hi[1], Math.round(centre[0]) + 0.5] }),
  lower: () => ({ yaw: -0.3, pitch: 0.95, dist: size * 0.95, target: [centre[0], 5, centre[2]], cuts: [hi[2], 7.6, lo[0]] }),
};
function setView(name) {
  const v = views[name]();
  Object.assign(cam, { yaw: v.yaw, pitch: v.pitch, dist: v.dist, target: v.target });
  sliders.cutZ.set(v.cuts[0]); sliders.cutY.set(v.cuts[1]); sliders.cutX.set(v.cuts[2]);
  draw();
}
document.querySelectorAll("[data-view]").forEach(b => b.addEventListener("click", () => setView(b.dataset.view)));

let drag = null;
canvas.addEventListener("contextmenu", e => e.preventDefault());
canvas.addEventListener("pointerdown", e => { drag = { x: e.clientX, y: e.clientY, pan: e.shiftKey || e.button === 2 }; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener("pointerup", () => { drag = null; });
canvas.addEventListener("pointermove", e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY;
  if (drag.pan) {
    const s = cam.dist / canvas.clientHeight, [r, u] = basis();
    for (let a = 0; a < 3; a++) cam.target[a] += (-dx * r[a] + dy * u[a]) * s;
  } else { cam.yaw += dx * 0.008; cam.pitch = Math.max(-1.5, Math.min(1.5, cam.pitch + dy * 0.008)); }
  draw();
});
canvas.addEventListener("wheel", e => { e.preventDefault(); cam.dist *= Math.exp(e.deltaY * 0.001); draw(); }, { passive: false });
canvas.addEventListener("keydown", e => {
  const k = { ArrowLeft: () => cam.yaw -= 0.1, ArrowRight: () => cam.yaw += 0.1, ArrowUp: () => cam.pitch = Math.min(1.5, cam.pitch + 0.1),
    ArrowDown: () => cam.pitch = Math.max(-1.5, cam.pitch - 0.1), "+": () => cam.dist *= 0.9, "=": () => cam.dist *= 0.9, "-": () => cam.dist *= 1.1 }[e.key];
  if (k) { k(); e.preventDefault(); draw(); }
});
addEventListener("resize", () => draw());

// ---- drawing ------------------------------------------------------------------------------
function eye() {
  const c = Math.cos(cam.pitch);
  return [cam.target[0] + cam.dist * c * Math.cos(cam.yaw), cam.target[1] + cam.dist * Math.sin(cam.pitch), cam.target[2] + cam.dist * c * Math.sin(cam.yaw)];
}
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const norm = a => { const l = Math.hypot(...a); return a.map(x => x / l); };
function basis() { const f = norm(sub(cam.target, eye())), r = norm(cross(f, [0, 1, 0])); return [r, cross(r, f), f]; }
function matrix(aspect) {
  const e = eye(), [r, u, f] = basis(), near = 0.05, far = size * 6, t = 1 / Math.tan(0.6);
  const view = [r[0], u[0], -f[0], 0, r[1], u[1], -f[1], 0, r[2], u[2], -f[2], 0,
    -(r[0] * e[0] + r[1] * e[1] + r[2] * e[2]), -(u[0] * e[0] + u[1] * e[1] + u[2] * e[2]), f[0] * e[0] + f[1] * e[1] + f[2] * e[2], 1];
  const proj = [t / aspect, 0, 0, 0, 0, t, 0, 0, 0, 0, (far + near) / (near - far), -1, 0, 0, 2 * far * near / (near - far), 0];
  const m = new Float32Array(16);
  for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) { let s = 0; for (let k = 0; k < 4; k++) s += proj[k * 4 + j] * view[i * 4 + k]; m[i * 4 + j] = s; }
  return m;
}
let pending = false;
function draw() { if (!pending) { pending = true; requestAnimationFrame(render); } }
function render() {
  pending = false;
  const dpr = devicePixelRatio || 1, w = Math.round(canvas.clientWidth * dpr), h = Math.round(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  gl.viewport(0, 0, w, h);
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  gl.clearColor(...(dark ? [0.11, 0.13, 0.15, 1] : [0.81, 0.87, 0.92, 1]));
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST); if (ship.nocull) gl.disable(gl.CULL_FACE); else gl.enable(gl.CULL_FACE); gl.disable(gl.BLEND); gl.depthMask(true);
  const mvp = matrix(w / h);
  const cutLo = [+sliders.cutX.el.value - 1e-4, -1e9, -1e9], cutHi = [1e9, +sliders.cutY.el.value + 1e-4, +sliders.cutZ.el.value + 1e-4];
  function use(p) {
    gl.useProgram(p);
    gl.uniformMatrix4fv(gl.getUniformLocation(p, "mvp"), false, mvp);
    gl.uniform3fv(gl.getUniformLocation(p, "cutLo"), cutLo); gl.uniform3fv(gl.getUniformLocation(p, "cutHi"), cutHi);
  }
  use(faces);
  gl.enable(gl.POLYGON_OFFSET_FILL); gl.polygonOffset(1, 1);
  const pass = glass => {
    for (const b of batches) {
      if (!shown[b.category] || b.texture.glass !== glass) continue;
      gl.bindTexture(gl.TEXTURE_2D, b.texture.tex);
      gl.uniform1f(gl.getUniformLocation(faces, "glass"), glass ? 1 : 0);
      gl.bindVertexArray(b.vao); gl.drawElements(gl.TRIANGLES, b.count, gl.UNSIGNED_INT, 0);
    }
  };
  pass(false);
  gl.disable(gl.POLYGON_OFFSET_FILL);
  if (document.getElementById("edges").checked) {
    use(lines); gl.uniform4f(gl.getUniformLocation(lines, "tint"), dark ? 0.85 : 0.1, dark ? 0.85 : 0.12, dark ? 0.9 : 0.15, 1);
    gl.bindVertexArray(edges.vao); gl.drawArrays(gl.LINES, 0, edges.count);
  }
  if (document.getElementById("marks").checked && marks.count > 0) {
    gl.disable(gl.DEPTH_TEST); use(lines); gl.uniform4f(gl.getUniformLocation(lines, "tint"), 0.95, 0.1, 0.1, 1);
    gl.bindVertexArray(marks.vao); gl.drawArrays(gl.LINES, 0, marks.count); gl.enable(gl.DEPTH_TEST);
  }
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA); gl.depthMask(false);
  use(faces); pass(true);
  if (document.getElementById("water").checked) {
    gl.disable(gl.CULL_FACE); use(lines);
    gl.uniform4f(gl.getUniformLocation(lines, "tint"), 0.2, 0.45, 0.65, 0.35);
    gl.bindVertexArray(water.vao); gl.drawArrays(gl.TRIANGLES, 0, water.count);
  }
  gl.depthMask(true); gl.bindVertexArray(null);
}
// The address can pick a view and options, e.g. two-bay.html#cutaway,edges
const wanted = location.hash.slice(1).split(",");
if (wanted.includes("edges")) document.getElementById("edges").checked = true;
if (wanted.includes("water")) document.getElementById("water").checked = true;
if (wanted.includes("marks")) document.getElementById("marks").checked = true;
setView(wanted.find(w => views[w]) || "exterior");
// (scripted views) cam=yaw:pitch:dist:tx:ty:tz, cut=z:y:x, hide=group+group
for (const w of wanted) {
  const [k, v] = w.split("=");
  if (!v) continue;
  const n = v.split(":").map(Number);
  if (k === "cam") Object.assign(cam, { yaw: n[0], pitch: n[1], dist: n[2], target: [n[3], n[4], n[5]] });
  if (k === "cut") { sliders.cutZ.set(n[0]); sliders.cutY.set(n[1]); sliders.cutX.set(n[2]); }
  if (k === "hide") for (const g of decodeURIComponent(v).split("+")) shown[g] = false;
}
draw();
</script>
</body>
</html>
